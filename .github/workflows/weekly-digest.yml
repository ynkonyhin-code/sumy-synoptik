name: Weekly digest

on:
  schedule:
    - cron: "0 6 * * 1"    # понедельник 06:00 UTC = 09:00 по Киеву летом, 08:00 зимой
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synoptic-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python weekly_digest.py
