name: Курс криптовалют

on:
  schedule:
    # Cron працює в UTC. 09:05 UTC = 12:05 Київ (літо), 10:05 UTC = 12:05 Київ (зима).
    # Скрипт сам публікує лише коли в Києві 12:xx, тож дубля не буде.
    - cron: "5 9,10 * * *"
  workflow_dispatch:   # ручний запуск з вкладки Actions (публікує одразу)

concurrency:
  group: kurs-kryptovalyut
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_kurs_kryptovalyut.txt

      - name: Шрифти з кирилицею
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - run: pip install -r requirements_kurs_kryptovalyut.txt

      - name: Публікація в Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Необов'язково: безкоштовний Demo-ключ CoinGecko (менше обмежень за ліміт запитів)
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python kurs_kryptovalyut.py
