name: Zahalni Boyovi Vtraty Auto-Poster

on:
  schedule:
    # Запуск каждые 15 минут
    - cron: '*/15 * * * *'
  workflow_dispatch: # Возможность ручного запуска из интерфейса GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Чтение репозитория
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск скрипта
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python zahalni_boyovi_vtraty.py

    - name: Сохранение истории опубликованных постов
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add zahalni_boyovi_vtraty_posted.txt
        git commit -m "Update posted IDs history [skip ci]" || exit 0
        git push