name: Zahalni Boyovi Vtraty Auto-Poster

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут
  workflow_dispatch:          # ручной запуск из интерфейса GitHub

permissions:
  contents: write             # нужно, чтобы сохранять историю опубликованных постов

concurrency:
  group: repo-state-commits   # общая очередь с другими скриптами, чтобы push не конфликтовал
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v5

      - name: Настройка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-vtraty.txt

      - name: Запуск скрипта
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python zahalni_boyovi_vtraty.py

      - name: Сохранение истории опубликованных постов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zahalni_boyovi_vtraty_posted.txt
          git diff --staged --quiet || git commit -m "Update posted IDs history (vtraty)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || true
            sleep 3
          done

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
