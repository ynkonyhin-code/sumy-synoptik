name: Sumska_filiya_hazmerezhi

on:
  schedule:
    - cron: "0 */3 * * *"   # каждые 3 часа (UTC)
  workflow_dispatch:         # ручной запуск

permissions:
  contents: write            # нужно, чтобы сохранять список опубликованных постов

concurrency:
  group: sumska-filiya-hazmerezhi
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python Sumska_filiya_hazmerezhi.py

      - name: Save posted IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sumska_filiya_hazmerezhi_posted.txt
          git diff --staged --quiet || (git commit -m "Update posted IDs" && git push)
