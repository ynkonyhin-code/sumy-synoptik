name: Погода, яка має значення

permissions:
  contents: write     # збереження журналу публікацій

on:
  schedule:
    # Cron працює в UTC. 18:05 UTC = 21:05 Київ (літо), 19:05 UTC = 21:05 Київ (зима).
    # Скрипт сам публікує лише коли в Києві 21:xx, тож дубля не буде.
    - cron: "5 18,19 * * *"
  workflow_dispatch:   # ручний запуск з вкладки Actions (публікує одразу)

concurrency:
  group: pohoda-yaka-maie-znachennia
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_pohoda_yaka_maie_znachennia.txt

      - name: Шрифти з кирилицею
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - run: pip install -r requirements_pohoda_yaka_maie_znachennia.txt

      - name: Публікація в Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python pohoda_yaka_maie_znachennia.py

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
