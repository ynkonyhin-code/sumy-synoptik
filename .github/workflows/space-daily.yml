name: Space weather daily

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC = 09:00 по Киеву (летнее время)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write             # нужно, чтобы сохранять базу synoptic.db

concurrency:
  group: synoptic-db          # не даём двум скриптам писать в базу одновременно
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python space_weather.py daily
      - name: Save database
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f synoptic.db ]; then
            git add synoptic.db
            git diff --staged --quiet || (git commit -m "update db" && git pull --rebase && git push)
          fi

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
