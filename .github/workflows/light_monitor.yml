name: Sumy Light Monitor

on:
  schedule:
    # Автоматический запуск каждые 30 минут
    - cron: '*/30 * * * *'
  
  # Кнопка для ручной проверки во вкладке Actions
  workflow_dispatch:

jobs:
  check-light-status:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Разрешение на сохранение файла last_post_id.txt в репозиторий

    steps:
    # 1. Скачиваем файлы из репозитория
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Настраиваем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. Устанавливаем зависимости из requirements.txt
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Запускаем парсер с токеном LIGHT_BOT_TOKEN
    - name: Run Light Checker Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.LIGHT_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python light_checker.py

    # 5. Сохраняем ID последнего отправленного поста обратно в GitHub, чтобы исключить дубли
    - name: Commit and Push last_post_id.txt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add last_post_id.txt || true
        git commit -m "Auto-update last processed post ID" || true
        git push || true