name: Нічна зміна (Кіт і Сова)

on:
  schedule:
    # Скрипт сам вирішує, що публікувати (за Києвом 20:00–12:00).
    # UTC 18-09 покриває і літній, і зимовий час. Хвилини не кратні 15: початок години в GitHub найзавантаженіший.
    - cron: "7,22,37,52 18-23,0-9 * * *"
  workflow_dispatch:
    inputs:
      test_kind:
        description: "Тест: evening / material / morning (порожньо = за розкладом)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nichna-zmina

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Стан ночі лежить у кеші, а не в git: 30 workflow'ів пишуть у main одночасно,
      # і попередній варіант (commit + pull --rebase + push) регулярно падав із non-fast-forward.
      - name: Відновити стан ночі
        uses: actions/cache/restore@v4
        with:
          path: .zmina_cache
          key: zmina-${{ github.run_id }}
          restore-keys: |
            zmina-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r nichna_requirements.txt

      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_KIND: ${{ github.event.inputs.test_kind }}
          NICHNA_CACHE_DIR: .zmina_cache
        run: python nichna_zmina.py

      - name: Зберегти стан ночі
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zmina_cache
          key: zmina-${{ github.run_id }}

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted state 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted state && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted state || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
