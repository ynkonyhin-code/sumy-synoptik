name: Daily Calendar Post

on:
  schedule:
    - cron: '0 7 * * *' # Щодня о 10:00 за Київським часом (07:00 UTC)
  workflow_dispatch:

jobs:
  post-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pillow bs4 tzdata

      - name: Run calendar script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python shchodennyy_kalendar.py