name: Щоденний календар

# Публікація щодня о 10:00 за Києвом.
#
# Чому так, а не «один cron на 10:05 Києва»:
# GitHub Actions виконує schedule-cron із затримкою — від кількох хвилин до кількох ГОДИН
# (у листопаді 2026 запуски приходили о 15:46–17:56 замість 10:05). Тому:
#   1) розклад стоїть щоразу о :05 і :35 — 6 слотів на добу, а не 2;
#   2) скрипт сам вирішує, чи публікувати: вікно 10:00–12:59 за Києвом
#      (запізнілий запуск усе одно вийде, але не пізніше 13:00 — щоб не публікувати ввечері);
#   3) від дублів захищає мітка в кеші Actions (ключ = дата за Києвом): один пост на добу.
#
# Ручний запуск (Run workflow) публікує ЗАВЖДИ і одразу, незалежно від часу.

on:
  schedule:
    - cron: "5 7 * * *"    # 10:05 Києва влітку (UTC+3)
    - cron: "5 8 * * *"    # 10:05 Києва взимку (UTC+2)
    - cron: "5 9 * * *"    # 11:05 Києва влітку (страховка від затримки)
    - cron: "35 7 * * *"   # 10:35 Києва влітку
    - cron: "35 8 * * *"   # 10:35 Києва взимку
    - cron: "35 9 * * *"   # 11:35 Києва взимку
  workflow_dispatch:
    inputs:
      date:
        description: "Дата РРРР-ММ-ДД (порожньо — сьогодні)"
        required: false
      dry_run:
        description: "Тільки показати, не публікувати"
        type: boolean
        default: false
      force:
        description: "Публікувати навіть якщо сьогодні вже був пост"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write        # для keepalive (розклад у публічному репо GitHub вимикає після 60 днів тиші)

concurrency:
  group: shchodennyy-kalendar
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keepalive — не даємо GitHub вимкнути розклад
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable shchodennyy_kalendar.yml

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Шрифти з кирилицею
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── антидубль: один пост на добу ─────────────────────────────────────
      - name: Дата за Києвом
        id: day
        run: echo "today=$(TZ=Europe/Kyiv date +%F)" >> "$GITHUB_OUTPUT"

      - name: Чи вже був пост сьогодні
        id: guard
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .post-flag
          key: kalendar-posted-${{ steps.day.outputs.today }}

      - name: Вікно публікації (за київським часом)
        id: gate
        run: |
          hour=$((10#$(TZ=Europe/Kyiv date +%H)))
          already="${{ steps.guard.outputs.cache-hit }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run=true; reason="ручний запуск"
          elif [ "$already" = "true" ] && [ "${{ inputs.force }}" != "true" ]; then
            run=false; reason="сьогодні вже опубліковано"
          elif [ "$hour" -ge 10 ] && [ "$hour" -lt 13 ]; then
            run=true; reason="вікно 10:00–12:59"
          else
            run=false; reason="поза вікном (зараз ${hour}:xx за Києвом)"
          fi
          echo "Київ: $(TZ=Europe/Kyiv date '+%F %H:%M') | run=$run | $reason"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Публікація
        if: steps.gate.outputs.run == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DATE_IN: ${{ inputs.date }}
          DRY_IN: ${{ inputs.dry_run }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          CARD_OUT: output/card.png
        run: |
          ARGS=""
          if [ -n "$DATE_IN" ]; then ARGS="$ARGS --date $DATE_IN"; fi
          if [ "$DRY_IN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python shchodennyy_kalendar.py $ARGS

      - name: Перевірити, що картка створилася
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: |
          if [ ! -s output/card.png ]; then
            echo "::error title=Картка не створена::output/card.png відсутній або порожній — пост вийшов без картинки"
            exit 1
          fi
          python -c "from PIL import Image; im=Image.open('output/card.png'); print('картка:', im.size)"

      - name: Картка для перегляду
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalendar-card-${{ steps.day.outputs.today }}
          path: output/card.png
          if-no-files-found: error

      - name: Позначити «опубліковано сьогодні»
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: |
          mkdir -p .post-flag
          date -u +"%FT%TZ" > .post-flag/posted

      - name: Зберегти мітку
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: .post-flag
          key: kalendar-posted-${{ steps.day.outputs.today }}
