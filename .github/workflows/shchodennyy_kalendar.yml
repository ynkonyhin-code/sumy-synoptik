name: Daily Calendar Post

on:
  schedule:
    - cron: '0 7 * * *' # Щодня о 07:00 UTC (10:00 за Києвом влітку / 09:00 взимку)
  workflow_dispatch: # Дозволяє запускати вручну з вкладки Actions

jobs:
  post-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pillow

      - name: Run calendar script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python shchodennyy_kalendar.py