name: Хвилинка тепла

on:
  schedule:
    # 10:00 за Києвом у літній час (UTC+3)
    - cron: "0 7 * * *"
    # 10:00 за Києвом у зимовий час (UTC+2)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Тестовий режим без публікації"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: khvylynka-tepla-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_khvylynka_tepla.txt

      - name: Встановити залежності
        run: python -m pip install -r requirements_khvylynka_tepla.txt

      - name: Запустити за розкладом
        if: github.event_name == 'schedule'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python khvylynka_tepla.py --scheduled

      - name: Ручний тестовий запуск
        if: github.event_name == 'workflow_dispatch' && inputs.test_mode
        run: python khvylynka_tepla.py --test

      - name: Ручна публікація
        if: github.event_name == 'workflow_dispatch' && !inputs.test_mode
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python khvylynka_tepla.py

      - name: Зберегти історію публікацій
        if: success() && github.event_name == 'schedule' || success() && github.event_name == 'workflow_dispatch' && !inputs.test_mode
        run: |
          if ! git diff --quiet -- khvylynka_tepla_history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add khvylynka_tepla_history.json
            git commit -m "Update Khvylynka Tepla publication history"
            git push
          fi
