name: Погода на вихідні

on:
  schedule:
    # П'ятниця: 14:00 і 15:00 UTC. Скрипт сам публікує лише після 17:00 за Києвом
    # і лише раз на вікенд, тож літній і зимовий час обробляються автоматично.
    - cron: "0 14,15 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: "Опублікувати зараз, ігноруючи розклад (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: pogoda-vykhidni

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Шрифти з кирилицею
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install -r vykhidni_requirements.txt
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python pogoda_vykhidni.py --force
          else
            python pogoda_vykhidni.py
          fi
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add pogoda_vykhidni_state.json || true
          git diff --cached --quiet || (git commit -m "pogoda_vykhidni: state" && git pull --rebase && git push)

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
