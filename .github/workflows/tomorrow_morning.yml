name: Tomorrow.io morning forecast

on:
  schedule:
    # 04:00 по Киеву: летом (UTC+3) = 01:xx UTC, зимой (UTC+2) = 02:xx UTC.
    # Запускаем в оба слота, а скрипт сам отправит только когда по Киеву 04:xx.
    - cron: "5 1 * * *"
    - cron: "5 2 * * *"
  workflow_dispatch:   # ручной запуск для теста (отправит сразу, без проверки часа)

concurrency:
  group: tomorrow-morning
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests matplotlib

      - name: Send forecast
        env:
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python tomorrow_morning.py
