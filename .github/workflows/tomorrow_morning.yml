name: Tomorrow.io three-day morning forecast

on:
  schedule:
    # GitHub cron uses UTC. Run in both possible Kyiv UTC offsets:
    # 04:05 UTC = 07:05 Kyiv in summer; 05:05 UTC = 07:05 Kyiv in winter.
    # The script sends only when the Kyiv local hour is 07.
    - cron: "5 4 * * *"
    - cron: "5 5 * * *"
  workflow_dispatch:

concurrency:
  group: tomorrow-3day-morning
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests matplotlib

      - name: Send three-day forecast
        env:
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -u tomorrow_morning.py
