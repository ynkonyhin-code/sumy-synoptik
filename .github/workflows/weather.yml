name: Sumy Synoptik Weather

on:
  schedule:
    # GitHub cron работает по UTC, а Киев живёт то по UTC+3 (лето), то по UTC+2 (зима).
    # Поэтому запуски стоят в ОБОИХ вариантах: 04/05 UTC -> 07:xx, 10/11 UTC -> 13:xx, 16/17 UTC -> 19:xx по Киеву.
    # Лишний запуск отсекает шаг "gate" ниже (он смотрит на реальный киевский час).
    # Минуты :05 — чтобы не попадать в «пробку» на круглых часах.
    - cron: "5 4,5,10,11,16,17 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Режим прогноза (auto — по текущему киевскому времени)"
        type: choice
        options: [auto, morning, noon, evening]
        default: auto
      dry_run:
        description: "Только собрать картинку (скачать из Artifacts), в канал НЕ публиковать"
        type: boolean
        default: false

permissions:
  contents: write     # збереження журналу публікацій
  actions: write      # нужно только для шага keepalive

concurrency:
  group: sumy-synoptik-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gate - чи зараз час публікувати (за київським часом)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"
            [ "$mode" = "auto" ] && mode=""
            run=true
          else
            # GitHub віддає раннер із затримкою 1–3 години, тому «рівно о 7-й» ловилось лише
            # зрідка (11.11 07:00 -> запуск о 07:35, 13:00 -> 12:30, а о 19:00 запуску не було).
            # Тепер на кожен випуск є вікно, а від повторів захищає кеш weather-<дата>-<режим>.
            hour=$((10#$(TZ=Europe/Kyiv date +%H)))
            case "$hour" in
              7|8|9)      mode=morning; run=true ;;
              13|14|15)   mode=noon;    run=true ;;
              19|20|21)   mode=evening; run=true ;;
              *)          mode="";      run=false ;;
            esac
          fi
          echo "Київська година: ${hour:-—} | run=$run | mode=${mode:-auto}"
          echo "run=$run"   >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Keepalive - не даємо GitHub вимкнути розклад (best-effort)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable weather.yml

      - name: Download repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (Pillow + шрифт с кириллицей)
        if: steps.gate.outputs.run == 'true'
        run: pip install pillow matplotlib

      - name: Restore anti-dup cache (один випуск на режим на добу)
        id: cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .weather-sent
          key: weather-${{ steps.gate.outputs.mode }}-${{ github.run_id }}
          # у кеші ключі незмінні, тому «останній» знаходимо префіксом
          restore-keys: |
            weather-${{ steps.gate.outputs.mode }}-

      - name: Уже опубліковано в цьому вікні?
        id: dup
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f .weather-sent/${{ steps.gate.outputs.mode }}.done ]; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
            echo "Режим ${{ steps.gate.outputs.mode }} уже виходив сьогодні — пропускаємо."
          else
            echo "sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish weather forecast
        if: steps.gate.outputs.run == 'true' && steps.dup.outputs.sent != 'true'
        env:
          SUMY_BOT_TOKEN: ${{ secrets.SUMY_BOT_TOKEN }}
          SUMY_CHANNEL: ${{ secrets.SUMY_CHANNEL }}
          MODE: ${{ steps.gate.outputs.mode }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          # відмітку ставимо ЛИШЕ після успішної публікації: інакше невдала спроба
          # з'їдала б увесь режим на добу (так і сталось 12.11 з ранковим випуском)
          python weather_daily.py
          if [ -z "$DRY_RUN" ]; then
            mkdir -p .weather-sent && date -u +%FT%TZ > ".weather-sent/$MODE.done"
          fi

      - name: Save anti-dup cache
        if: steps.gate.outputs.run == 'true' && steps.dup.outputs.sent != 'true' && inputs.dry_run != true
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .weather-sent
          key: weather-${{ steps.gate.outputs.mode }}-${{ github.run_id }}

      - name: Save preview image (dry run)
        if: steps.gate.outputs.run == 'true' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: forecast-preview
          path: forecast.png

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
