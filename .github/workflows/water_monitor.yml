name: Sumy Water Monitor

on:
  schedule:
    # Кожні 30 хвилин (зі зсувом на 15-ту та 45-ту хвилину, щоб не навантажувати «секунда в секунду»)
    - cron: '15,45 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тільки показати пост у логу, нічого не публікувати"
        type: boolean
        default: false

concurrency:
  group: sumy-water-monitor
  cancel-in-progress: false

jobs:
  check-water-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Water Checker Script
        env:
          # Той самий бот-адмін, що й для світла
          TELEGRAM_BOT_TOKEN: ${{ secrets.LIGHT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python water_checker.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and Push last_water_post_id.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f last_water_post_id.txt ]; then git add last_water_post_id.txt; fi
          git diff --cached --quiet || (git commit -m "Auto-update last processed water post ID" && git push)
