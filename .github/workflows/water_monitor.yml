name: Sumy Water Monitor

on:
  schedule:
    # Запуск каждые 30 минут (с небольшим сдвигом на 15-ю минуту, чтобы не перегружать секунду в секунду)
    - cron: '15,45 * * * *'
  
  workflow_dispatch:

jobs:
  check-water-status:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Water Checker Script
      env:
        # Можно использовать тот же токен бота, что и для света, или любого другого админа
        TELEGRAM_BOT_TOKEN: ${{ secrets.LIGHT_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python water_checker.py

    - name: Commit and Push last_water_post_id.txt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add last_water_post_id.txt || true
        git commit -m "Auto-update last processed water post ID" || true
        git push || true