name: rukh_troleybusiv

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хвилин
  workflow_dispatch:
    inputs:
      test_latest:
        description: "Тест: опублікувати останній відповідний пост, ігноруючи збережений стан"
        type: boolean
        default: false

permissions:
  contents: write   # потрібно, щоб зберігати rukh_troleybusiv_state.json

concurrency:
  group: rukh_troleybusiv
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rukh_troleybusiv_requirements.txt

      - name: Install dependencies
        run: pip install -r rukh_troleybusiv_requirements.txt

      - name: Run rukh_troleybusiv
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_LATEST: ${{ inputs.test_latest }}
        run: python rukh_troleybusiv.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rukh_troleybusiv_state.json
          git diff --cached --quiet || (git commit -m "rukh_troleybusiv: update state" && git pull --rebase origin "${{ github.ref_name }}" && git push)

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
