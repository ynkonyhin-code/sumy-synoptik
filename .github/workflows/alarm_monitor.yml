name: Sumy Alarm Monitor

on:
  schedule:
    # Запуск каждые 5 минут для максимальной оперативности
    - cron: '*/5 * * * *'
  
  workflow_dispatch:

jobs:
  check-alarm-status:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Alarm Checker Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.LIGHT_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python alarm_checker.py

    - name: Commit and Push last_alarm_post_id.txt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add last_alarm_post_id.txt || true
        git commit -m "Auto-update last processed alarm post ID" || true
        git push || true