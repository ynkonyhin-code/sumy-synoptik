name: Daily Currency & Fuel Post

on:
  schedule:
    # Публикация в 08:00 по Киеву круглый год.
    # Запуск в 07:30 по Киеву: летом (UTC+3) = 04:30 UTC, зимой (UTC+2) = 05:30 UTC.
    # Скрипт сам выбирает нужный слот, ждёт до 08:00 и публикует; второй слот пропускается.
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: daily-rates
  cancel-in-progress: false

jobs:
  publish-daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jinja2 playwright beautifulsoup4

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Rates Publisher Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python rates_publisher.py
