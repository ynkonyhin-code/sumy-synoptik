name: Daily Currency & Fuel Post

permissions:
  contents: write     # збереження журналу публікацій

on:
  schedule:
    # Публикация в 08:00 по Киеву круглый год.
    # GitHub отдаёт раннер с задержкой 1–3 часа, а «ровно в 08:00» ловилось лишь изредка
    # (11.11: запуск 08:00 -> 11:59, 10.11 -> 13:40). Теперь слоты идут с шагом 30 минут
    # с 06:00 до 10:00 UTC (08–12 по Киеву): первый проснувшийся раннер ждёт до 08:00
    # и публикует, остальные отсекает SCHEDULE-проверка и кеш rates-<дата>.
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: daily-rates
  cancel-in-progress: false

jobs:
  publish-daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jinja2 playwright beautifulsoup4

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Anti-dup — чи вже виходило сьогодні
        id: cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: rates-${{ github.run_id }}
          restore-keys: |
            rates-

      - name: Run Rates Publisher Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$SCHEDULE" ] && [ -f .sent/done ]; then
            echo "Курс і пальне сьогодні вже виходили — пропускаємо."
            exit 0
          fi
          python rates_publisher.py
          if [ -n "$SCHEDULE" ]; then mkdir -p .sent && date -u +%FT%TZ > .sent/done; fi

      - name: Save anti-dup cache
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sent
          key: rates-${{ github.run_id }}

      - name: Зберегти журнал публікацій (для «Підсумку тижня»)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "synoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal/posted 2>/dev/null || exit 0
          git diff --cached --quiet -- journal/posted && exit 0
          git commit -m "journal: posted $(TZ=Europe/Kyiv date +%F)" -- journal/posted || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash || git rebase --abort
            sleep 3
          done
