# ФАЙЛ: ukrainealarm_probe.yml | ПРОЄКТ: «Сумський синоптик» | ЗАДАЧА: одноразова діагностика Ukraine Alarm API
# КУДИ КЛАСТИ: .github/workflows/ukrainealarm_probe.yml   (пара: ukrainealarm_probe.py у корені репозиторію)
# Потрібен секрет UKRAINEALARM_API_KEY (Settings → Secrets and variables → Actions → New repository secret).
# Запуск ТІЛЬКИ вручну: Actions → «Ukraine Alarm — діагностика» → Run workflow. Нічого нікуди не публікує.
# Результат — у лозі кроку «Опитати API». Ключ у лозі не показується (GitHub маскує секрети).
name: Ukraine Alarm — діагностика

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Опитати API
        env:
          UKRAINEALARM_API_KEY: ${{ secrets.UKRAINEALARM_API_KEY }}
        run: python -u ukrainealarm_probe.py
